  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module">
    let PRODUCTS = [];
    let mapPicker = null;
    let mapMarker = null;
    let mapAddBtn = null;

    function destroyMap() {
      if (mapAddBtn) {
        try { mapAddBtn.remove(); } catch (_) {}
        mapAddBtn = null;
      }
      if (mapPicker) {
        try { mapPicker.remove(); } catch (_) {}
        mapPicker = null;
      }
      mapMarker = null;
    }

    async function reverseGeocode(lat, lng) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=fa`;
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error("geocode");
        const data = await res.json();
        const a = data.address || {};
        const parts = [
          a.city || a.town || a.village || a.state,
          a.suburb || a.neighbourhood || a.district,
          a.road || a.pedestrian || a.residential
        ].filter(Boolean);
        if (parts.length) return parts.join("، ");
        if (data.display_name) {
          return data.display_name.split(",").slice(0, 3).map(s => s.trim()).join("، ");
        }
      } catch (_) {}
      return null;
    }

    const state = {
      activeProductId: null,
      activeImageIdx: 0,
      selectedColor: null,
      swiper: null,
      category: "همه",
      cart: JSON.parse(localStorage.getItem("ha_cart") || "{}"),
      userRatings: JSON.parse(localStorage.getItem("ha_ratings") || "{}"),
      filterPriceMin: null,
      filterPriceMax: null,
      filterMinRating: 0,
      checkoutStep: 1,
      maxCheckoutStep: 1,
      orderNote: ""
    };

    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];

    const FA_DIGITS = "۰۱۲۳۴۵۶۷۸۹";
    function toFaDigits(v) {
      return String(v).replace(/\d/g, d => FA_DIGITS[+d]);
    }

    function formatPrice(n) {
      return toFaDigits(new Intl.NumberFormat("fa-IR").format(n));
    }

    function score(p) {
      return p.rating * 18 + Math.log10((p.orders || 0) + 1) * 12;
    }

    function effectiveRating(p) {
      return (state.userRatings && state.userRatings[p.id] != null) ? state.userRatings[p.id] : p.rating;
    }

    function topProducts(n = 5) {
      return [...PRODUCTS].sort((a, b) => score(b) - score(a)).slice(0, n);
    }

    function getProduct(id) {
      return PRODUCTS.find(p => p.id === id);
    }

    function ratingHtml(productId, value, sizeClass = "") {
      const v = Math.max(1, Math.min(5, Math.round(Number(value) || 0)));
      // stars 1..5 left-to-right; fill via CSS :has / sibling on hover & checked
      let html = `<div class="rating ${sizeClass}" data-rating-for="${productId}" data-value="${v}" role="radiogroup" aria-label="امتیاز">`;
      for (let i = 1; i <= 5; i++) {
        const checked = i === v ? " checked" : "";
        html += `<input type="radio" name="rating-${productId}" value="${i}" aria-label="${toFaDigits(i)} ستاره"${checked} />`;
      }
      html += `</div>`;
      return html;
    }

    function bindRating(root = document) {
      root.querySelectorAll(".rating").forEach(group => {
        if (group.dataset.bound) return;
        group.dataset.bound = "1";
        const rawId = group.getAttribute("data-rating-for") || "";
        const pid = rawId.replace(/-card$/, "");
        group.querySelectorAll("input").forEach(input => {
          input.addEventListener("change", () => {
            const val = Number(input.value);
            state.userRatings[pid] = val;
            localStorage.setItem("ha_ratings", JSON.stringify(state.userRatings));
            const p = getProduct(pid);
            if (p) p.rating = val;
            group.dataset.value = String(val);
            // sync other ratings for same product
            document.querySelectorAll(`.rating[data-rating-for="${pid}"], .rating[data-rating-for="${pid}-card"]`).forEach(g => {
              if (g === group) return;
              g.dataset.value = String(val);
              g.querySelectorAll("input").forEach(inp => {
                inp.checked = Number(inp.value) === val;
              });
            });
          });
        });
      });
    }


    function cartEntriesForProduct(id) {
      return Object.entries(state.cart).filter(([key, entry]) => {
        const eid = typeof entry === "object" ? entry.id : key;
        return eid === id;
      });
    }

    function cartQtyForProduct(id) {
      return cartEntriesForProduct(id).reduce((sum, [, entry]) => sum + (typeof entry === "object" ? entry.qty : entry), 0);
    }

    function preferredColorForProduct(id, fallback) {
      const entries = cartEntriesForProduct(id);
      if (!entries.length) return fallback;
      const last = entries[entries.length - 1][1];
      return (typeof last === "object" && last.color) ? last.color : fallback;
    }



    function ordersLiveHtml(orders, extraClass = "") {
      return `<span class="orders-live ${extraClass}" title="به‌روز">
        ${formatPrice(orders)} سفارش
        <span class="orders-live__dot" aria-hidden="true"></span>
      </span>`;
    }

    function lockScroll(on) {
      document.documentElement.classList.toggle("is-locked", on);
      document.body.classList.toggle("is-locked", on);
      if (on) {
        const y = window.scrollY || document.documentElement.scrollTop;
        document.body.dataset.scrollY = String(y);
        document.body.style.top = `-${y}px`;
        document.body.style.position = "fixed";
        document.body.style.width = "100%";
      } else {
        const y = Number(document.body.dataset.scrollY || 0);
        document.body.style.position = "";
        document.body.style.top = "";
        document.body.style.width = "";
        window.scrollTo(0, y);
      }
    }

    function cartCount() {
      return Object.values(state.cart).reduce((a, b) => a + (b.qty || b), 0);
    }

    function saveCart() {
      localStorage.setItem("ha_cart", JSON.stringify(state.cart));
      updateCartBadge();
    }

    function updateCartBadge() {
      const badge = $("#cartBadge");
      if (!badge) return;
      const n = cartCount();
      badge.textContent = toFaDigits(n);
      badge.dataset.count = String(n);
    }

    function addToCart(id, qty = 1, color = null) {
      const key = color ? `${id}__${color}` : id;
      const prev = state.cart[key];
      if (prev && typeof prev === "object") {
        prev.qty += qty;
      } else if (typeof prev === "number") {
        state.cart[key] = { id, color, qty: prev + qty };
      } else {
        state.cart[key] = { id, color, qty };
      }
      saveCart();
    }

    function setCartQty(key, qty, { confirmDelete = true } = {}) {
      if (qty <= 0) {
        if (confirmDelete) {
          const entry = state.cart[key];
          const id = entry && typeof entry === "object" ? entry.id : key.split("__")[0];
          const p = getProduct(id);
          const name = p ? p.name : "این کالا";
          if (!window.confirm(`از حذف کالای «${name}» مطمئن هستید؟`)) return false;
        }
        delete state.cart[key];
      } else {
        const item = state.cart[key];
        if (item && typeof item === "object") item.qty = qty;
        else state.cart[key] = qty;
      }
      saveCart();
      renderCart();
      return true;
    }


    function setProductCartQty(id, color, qty) {
      const key = color ? `${id}__${color}` : id;
      if (qty <= 0) {
        // remove all variants or specific
        if (color) setCartQty(key, 0);
        else {
          cartEntriesForProduct(id).forEach(([k]) => setCartQty(k, 0, { confirmDelete: false }));
        }
        return;
      }
      if (state.cart[key] && typeof state.cart[key] === "object") {
        state.cart[key].qty = qty;
        state.cart[key].color = color;
      } else {
        state.cart[key] = { id, color, qty };
      }
      saveCart();
    }

    function maxSlideCount() {
      const el = $("#collection");
      const width = el ? el.clientWidth : (window.innerWidth - 32);
      const gap = 10;
      const minClosed = 72;
      const minOpen = Math.min(320, Math.max(240, Math.floor(width * 0.42)));
      // width >= minOpen + (n - 1) * (minClosed + gap)
      const n = Math.floor(1 + (width - minOpen) / (minClosed + gap));
      return Math.max(2, Math.min(PRODUCTS.length || 5, n));
    }

    function renderCollection() {
      const capacity = maxSlideCount();
      const tops = topProducts(capacity);
      const wrap = $("#collectionSlides");
      const el = $("#collection");
      if (el) {
        const w = el.clientWidth || 800;
        const minOpen = Math.min(320, Math.max(240, Math.floor(w * 0.42)));
        el.style.setProperty("--slide-min-closed", "72px");
        el.style.setProperty("--slide-min-open", minOpen + "px");
      }
      wrap.innerHTML = tops.map((p, i) => {
        const num = toFaDigits(String(i + 1).padStart(2, "0"));
        const openClass = i === 0 ? " is-open" : "";
        const displayRating = effectiveRating(p);
        return `
          <article class="swiper-slide${openClass}" data-id="${p.id}" tabindex="0"
            aria-expanded="${i === 0 ? "true" : "false"}">
            <img class="cover" src="${p.images[0]}" alt="${p.name}" loading="${i < 2 ? "eager" : "lazy"}" width="1100" height="900" />
            <div class="scrim"></div>
            <div class="vertical-title">
              <span>${num} / ${p.model}</span>
              <strong>${p.name}</strong>
            </div>
            <div class="expanded">
              <span class="category">${p.slogan || ""}</span>
              <h2>${p.name}</h2>
              <p>${p.desc}</p>
              <div class="card-footer">
                <div class="slide-meta">
                  <div class="meta-split">
                    ${ratingHtml(p.id + "-slide", displayRating, "rating--sm rating--ro")}
                    ${ordersLiveHtml(p.orders)}
                  </div>
                  <small>${formatPrice(p.price)} تومان</small>
                </div>
                <button type="button" class="card-action" data-open="${p.id}">ثبت سفارش</button>
              </div>
            </div>
          </article>`;
      }).join("");
    }

    function expandCard(card) {
      const root = $("#collection");
      const cards = [...root.querySelectorAll(".swiper-slide")];
      const wasOpen = card.classList.contains("is-open");

      cards.forEach(item => {
        item.classList.remove("is-open");
        item.setAttribute("aria-expanded", "false");
      });

      if (!wasOpen) {
        card.classList.add("is-open");
        card.setAttribute("aria-expanded", "true");
      } else if (cards.length) {
        // keep one open for visual balance
        card.classList.add("is-open");
        card.setAttribute("aria-expanded", "true");
      }
    }

    function initCollection() {
      const root = $("#collection");
      if (state.swiper) {
        try { state.swiper.destroy(true, true); } catch (_) {}
        state.swiper = null;
      }

      // Flex-based fit layout; Swiper mainly for touch/drag optional
      state.swiper = new Swiper(root, {
        slidesPerView: "auto",
        spaceBetween: 0,
        speed: 500,
        allowTouchMove: true,
        simulateTouch: true,
        resistanceRatio: 0,
        watchOverflow: true,
        on: {
          init() {
            // neutralize translate so flex layout stays full-width
            this.wrapperEl.style.transform = "none";
            this.update();
          },
          setTranslate() {
            this.wrapperEl.style.transform = "none";
          }
        }
      });

      const cards = [...root.querySelectorAll(".swiper-slide")];
      cards.forEach(card => {
        card.addEventListener("click", e => {
          if (e.target.closest(".card-action")) return;
          expandCard(card);
        });
        card.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            expandCard(card);
          }
        });
      });
    }


    function openOrderModal(id) {
      const p = getProduct(id);
      if (!p) return;
      state.activeProductId = id;
      state.activeImageIdx = 0;
      const colors = Array.isArray(p.colors) && p.colors.length ? p.colors : ["#0a0a0a"];
      state.selectedColor = preferredColorForProduct(id, colors[0]);
      if (!colors.includes(state.selectedColor)) state.selectedColor = colors[0];
      const stock = Math.max(1, Number(p.stock) || 1);
      let modalQty = cartQtyForProduct(id);
      if (modalQty < 1) modalQty = 1;
      if (modalQty > stock) modalQty = stock;
      const displayRating = state.userRatings[p.id] ?? p.rating;

      $("#modalTitle").textContent = p.name;
      $("#modalModel").textContent = `مدل: ${p.model}`;

      const thumbs = p.images.map((src, i) => `
        <button type="button" class="modal__thumb ${i === 0 ? "is-active" : ""}" data-idx="${i}" aria-label="تصویر ${toFaDigits(i + 1)}">
          <img src="${src}" alt="" loading="lazy" width="56" height="56" />
        </button>`).join("");

      const swatches = colors.map((c) => `
        <button type="button" class="swatch ${c === state.selectedColor ? "is-selected" : ""}" data-color="${c}"
          style="background:${c}" aria-label="رنگ" title="${c}"></button>`).join("");

      const lineTotal = () => formatPrice(p.price * modalQty) + " تومان";

      $("#modalBody").innerHTML = `
        <div class="modal__gallery">
          <div class="modal__main-img">
            <img id="modalMainImg" src="${p.images[0]}" alt="${p.name}" width="600" height="375" />
          </div>
          <div class="modal__thumbs">${thumbs}</div>
        </div>
        <p class="modal__desc">${p.desc}</p>
        <div class="swatch-picker" role="listbox" aria-label="انتخاب رنگ">
          <div class="swatch-picker__label">رنگ</div>
          ${swatches}
        </div>
        <div class="modal-qty">
          <span class="modal-qty__label">تعداد</span>
          <div class="number-input" id="modalNumberInput">
            <button type="button" id="modalQtyMinus" aria-label="کاهش">−</button>
            <input type="number" id="modalQtyInput" min="1" max="${stock}" value="${modalQty}" inputmode="numeric" style="width: stretch;" />
            <button type="button" id="modalQtyPlus" aria-label="افزایش">+</button>
          </div>
          <div class="number-input__hint">موجودی: ${toFaDigits(stock)}</div>
        </div>
        <div class="modal-price-row">
          <div class="modal-price" id="modalLinePrice">${lineTotal()}</div>
          <div class="modal-rating-row">
            ${ratingHtml(p.id, displayRating)}
            ${ordersLiveHtml(p.orders)}
          </div>
        </div>`;

      const qtyInput = $("#modalQtyInput");
      const syncQty = () => {
        modalQty = Math.max(1, Math.min(stock, Number(qtyInput.value) || 1));
        qtyInput.value = String(modalQty);
        $("#modalLinePrice").textContent = lineTotal();
        $("#modalQtyMinus").disabled = modalQty <= 1;
        $("#modalQtyPlus").disabled = modalQty >= stock;
      };
      $("#modalQtyMinus").onclick = () => { qtyInput.value = String(modalQty - 1); syncQty(); };
      $("#modalQtyPlus").onclick = () => { qtyInput.value = String(modalQty + 1); syncQty(); };
      qtyInput.addEventListener("change", syncQty);
      qtyInput.addEventListener("input", syncQty);
      syncQty();

      $("#modalBody").querySelectorAll(".modal__thumb").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = +btn.dataset.idx;
          state.activeImageIdx = idx;
          $("#modalMainImg").src = p.images[idx];
          $("#modalBody").querySelectorAll(".modal__thumb").forEach(b =>
            b.classList.toggle("is-active", +b.dataset.idx === idx)
          );
        });
      });

      $("#modalBody").querySelectorAll(".swatch").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedColor = btn.getAttribute("data-color");
          $("#modalBody").querySelectorAll(".swatch").forEach(s =>
            s.classList.toggle("is-selected", s === btn)
          );
        });
      });

      bindRating($("#modalBody"));

      $("#addToCartBtn").textContent = cartQtyForProduct(id) > 0 ? "به‌روزرسانی سبد" : "افزودن به سبد";
      $("#addToCartBtn").onclick = () => {
        const key = state.selectedColor ? `${p.id}__${state.selectedColor}` : p.id;
        cartEntriesForProduct(p.id).forEach(([k]) => { delete state.cart[k]; });
        if (modalQty > 0) {
          state.cart[key] = { id: p.id, color: state.selectedColor, qty: modalQty };
        }
        saveCart();
        closeOrderModal();
      };

      const ov = $("#orderModal");
      ov.hidden = false;
      requestAnimationFrame(() => ov.classList.add("is-open"));
      ov.setAttribute("aria-hidden", "false");
      lockScroll(true);
      $("#closeModal").focus();
    }

    function closeOrderModal() {
      state.activeProductId = null;
      const ov = $("#orderModal");
      ov.classList.remove("is-open");
      ov.setAttribute("aria-hidden", "true");
      lockScroll(false);
      setTimeout(() => { ov.hidden = true; }, 220);
    }

    function openCartModal() {
      renderCart();
      const ov = $("#cartModal");
      ov.hidden = false;
      requestAnimationFrame(() => ov.classList.add("is-open"));
      ov.setAttribute("aria-hidden", "false");
      lockScroll(true);
    }

    function closeCartModal() {
      const ov = $("#cartModal");
      ov.classList.remove("is-open");
      ov.setAttribute("aria-hidden", "true");
      lockScroll(false);
      setTimeout(() => { ov.hidden = true; }, 220);
    }

    function loadProfile() {
      try {
        return JSON.parse(localStorage.getItem("ha_profile") || "{}") || {};
      } catch (_) {
        return {};
      }
    }

    function saveProfile(profile) {
      try {
        localStorage.setItem("ha_profile", JSON.stringify(profile || {}));
      } catch (_) {}
    }

    function renderCart() {
      state.checkoutStep = 1;
      renderCheckoutWizard();
    }

    function trashIcon() {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;
    }

    function renderStepper(active) {
      state.maxCheckoutStep = Math.max(state.maxCheckoutStep || 1, active || 1);
      const max = state.maxCheckoutStep || 1;
      const steps = [
        { n: 1, label: "سبد" },
        { n: 2, label: "اطلاعات" },
        { n: 3, label: "تأیید" }
      ];
      const host = $("#cartStepper");
      if (!host) return;
      host.innerHTML = steps.map(s => {
        const cls = s.n === active ? "is-active" : (s.n < active ? "is-done" : "");
        const disabled = s.n > max ? "disabled" : "";
        return `<button type="button" class="stepper__item ${cls}" data-step="${s.n}" ${disabled}>${toFaDigits(s.n)}. ${s.label}</button>`;
      }).join("");
      host.querySelectorAll("[data-step]").forEach(btn => {
        btn.addEventListener("click", () => {
          const n = +btn.dataset.step;
          if (n <= (state.maxCheckoutStep || 1)) {
            state.checkoutStep = n;
            renderCheckoutWizard();
          }
        });
      });
    }


    function renderCheckoutWizard() {
      const step = state.checkoutStep || 1;
      const body = $("#cartBody");
      const footer = $("#cartFooter");
      if (mapPicker && step !== 2) destroyMap();
      renderStepper(step);
      if (step === 1) renderCartStep(body, footer);
      else if (step === 2) renderInfoStep(body, footer);
      else renderConfirmStep(body, footer);
    }

    function renderCartStep(body, footer) {
      const keys = Object.keys(state.cart);
      if (!keys.length) {
        body.innerHTML = `<p class="cart-empty">سبد خرید خالی است</p>`;
        footer.innerHTML = "";
        return;
      }
      let total = 0;
      body.innerHTML = `<div class="cart-list">${keys.map(key => {
        const entry = state.cart[key];
        const id = typeof entry === "object" ? entry.id : key;
        const qty = typeof entry === "object" ? entry.qty : entry;
        const color = typeof entry === "object" ? entry.color : null;
        const p = getProduct(id);
        if (!p) return "";
        const stock = Math.max(1, Number(p.stock) || 1);
        const safeQty = Math.min(qty, stock);
        if (safeQty !== qty) {
          if (typeof entry === "object") entry.qty = safeQty;
          else state.cart[key] = safeQty;
        }
        total += p.price * safeQty;
        const colorDot = color
          ? `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);margin-inline-start:6px;vertical-align:middle"></span>`
          : "";
        return `
          <div class="cart-row" data-key="${key}" data-id="${id}" data-stock="${stock}">
            <button type="button" class="cart-row__hit" data-edit="${id}" aria-label="اصلاح ${p.name}" style="all:unset;cursor:pointer;display:contents">
              <img src="${p.images[0]}" alt="" width="56" height="56" />
              <div>
                <div class="cart-row__name">${p.name}${colorDot}</div>
                <div class="cart-row__price">${formatPrice(p.price)} تومان</div>
              </div>
            </button>
            <div class="number-input" data-cart-key="${key}">
              <button type="button" data-qty="-1" aria-label="کاهش">−</button>
              <input type="number" min="1" max="${stock}" value="${safeQty}" inputmode="numeric" aria-label="تعداد" />
              <button type="button" data-qty="1" aria-label="افزایش">+</button>
            </div>
            <button type="button" class="btn-del" data-remove="1" aria-label="حذف">${trashIcon()}</button>
          </div>`;
      }).join("")}</div>`;
      saveCart();

      body.querySelectorAll(".cart-row").forEach(row => {
        const key = row.dataset.key;
        const stock = +row.dataset.stock || 1;
        const input = row.querySelector("input[type=number]");
        const apply = (next) => {
          next = Math.max(0, Math.min(stock, next));
          if (next <= 0) { setCartQty(key, 0); return; }
          setCartQty(key, next, { confirmDelete: false });
        };
        row.querySelectorAll("[data-qty]").forEach(btn => {
          btn.addEventListener("click", () => apply((Number(input.value) || 1) + (+btn.getAttribute("data-qty"))));
        });
        input.addEventListener("change", () => apply(Number(input.value) || 1));
        const rm = row.querySelector("[data-remove]");
        if (rm) rm.addEventListener("click", () => setCartQty(key, 0));
        const edit = row.querySelector("[data-edit]");
        if (edit) edit.addEventListener("click", () => {
          closeCartModal();
          setTimeout(() => openOrderModal(edit.getAttribute("data-edit")), 240);
        });
      });

      footer.innerHTML = `
        <div class="cart-total"><span>جمع</span><span>${formatPrice(total)} تومان</span></div>
        <div class="modal-footer-row" style="margin-top:12px">
          <button type="button" class="btn btn--primary" id="toStep2">ادامه</button>
        </div>`;
      $("#toStep2").onclick = () => {
        if (!Object.keys(state.cart).length) return;
        state.checkoutStep = 2;
        state.maxCheckoutStep = Math.max(state.maxCheckoutStep || 1, 2);
        renderCheckoutWizard();
      };
    }

    function renderInfoStep(body, footer) {
      const profile = loadProfile();
      if (!Array.isArray(profile.phones) || !profile.phones.length) profile.phones = [""];
      if (!Array.isArray(profile.addresses)) profile.addresses = [];
      saveProfile(profile);

      body.innerHTML = `
        <div class="checkout-step">
          <div class="form-grid">
            <label>نام و نام خانوادگی *
              <input type="text" id="chkFullName" value="${((profile.firstName || "") + " " + (profile.lastName || "")).trim()}" required autocomplete="name" placeholder="مثلاً سارا محمدی" />
            </label>
          </div>
          <div style="margin-top:14px">
            <strong style="font-size:0.9rem;display:block;margin-bottom:8px">شماره تماس *</strong>
            <div class="phone-list" id="phoneList"></div>
            <button type="button" class="btn btn--ghost btn--sm" id="addPhoneBtn" style="margin-top:8px;width:100%">افزودن شماره</button>
          </div>
          <div style="margin-top:16px">
            <strong style="font-size:0.9rem;display:block;margin-bottom:8px">آدرس‌های ذخیره‌شده *</strong>
            <div class="addr-list" id="addrList"></div>
            <div class="map-wrap">
              <div id="mapPicker"></div>
            </div>
          </div>
        </div>`;

      const renderPhones = () => {
        const list = $("#phoneList");
        const p = loadProfile();
        let items = Array.isArray(p.phones) && p.phones.length ? p.phones : [""];
        p.phones = items;
        saveProfile(p);
        const canDelete = items.length > 1;
        list.innerHTML = items.map((ph, i) => `
          <div class="phone-item">
            <input type="tel" value="${ph}" data-phone-idx="${i}" placeholder="۰۹۱۲۱۲۳۴۵۶۷" />
            <button type="button" class="btn-del" data-del-phone="${i}" aria-label="حذف شماره" ${canDelete ? "" : "disabled"}>${trashIcon()}</button>
          </div>`).join("");
        list.querySelectorAll("[data-phone-idx]").forEach(inp => {
          inp.addEventListener("change", () => {
            const pr = loadProfile();
            pr.phones = pr.phones || [];
            pr.phones[+inp.dataset.phoneIdx] = inp.value.trim();
            saveProfile(pr);
          });
        });
        list.querySelectorAll("[data-del-phone]").forEach(btn => {
          btn.addEventListener("click", () => {
            if (btn.disabled) return;
            const pr = loadProfile();
            const idx = +btn.dataset.delPhone;
            const num = (pr.phones && pr.phones[idx]) ? pr.phones[idx] : "";
            const label = num ? `شماره «${num}»` : "این شماره تماس";
            if (!window.confirm(`از حذف ${label} مطمئن هستید؟`)) return;
            pr.phones.splice(idx, 1);
            if (!pr.phones.length) pr.phones = [""];
            saveProfile(pr);
            renderPhones();
          });
        });
      };

      const selectAddr = (id, { rerender = false } = {}) => {
        const pr = loadProfile();
        if (pr.selectedAddressId === id && !rerender) {
          // just ensure visual state
          document.querySelectorAll(".addr-item").forEach(el => {
            el.classList.toggle("is-selected", el.dataset.addrId === id);
          });
          return;
        }
        pr.selectedAddressId = id;
        saveProfile(pr);
        if (rerender) renderAddrs();
        else {
          document.querySelectorAll(".addr-item").forEach(el => {
            el.classList.toggle("is-selected", el.dataset.addrId === id);
          });
        }
      };

      const renderAddrs = () => {
        const list = $("#addrList");
        const p = loadProfile();
        const items = Array.isArray(p.addresses) ? p.addresses : [];
        const sel = p.selectedAddressId;
        if (!items.length) {
          list.innerHTML = `<p style="font-size:0.85rem;color:var(--color-text-muted)">هنوز آدرسی نیست — روی نقشه کلیک کنید</p>`;
          return;
        }
        list.innerHTML = items.map(a => `
          <div class="addr-item ${sel === a.id ? "is-selected" : ""}" data-addr-id="${a.id}" tabindex="0" role="button" aria-pressed="${sel === a.id ? "true" : "false"}">
            <div class="addr-item__fields">
              <div class="addr-item__label">${a.label || "آدرس"}</div>
              <div class="addr-item__meta">
                <div class="addr-field">
                  <label for="plaque-${a.id}">پلاک</label>
                  <input type="text" id="plaque-${a.id}" data-f="plaque" value="${a.plaque || ""}" placeholder="شماره پلاک یا نام ساختمان" />
                </div>
                <div class="addr-field">
                  <label for="unit-${a.id}">واحد</label>
                  <input type="text" id="unit-${a.id}" data-f="unit" value="${a.unit || ""}" placeholder="شماره واحد" />
                </div>
              </div>
              <div class="addr-field">
                <label for="desc-${a.id}">توضیحات آدرس</label>
                <input type="text" id="desc-${a.id}" data-f="desc" value="${a.desc || ""}" placeholder="اختیاری" />
              </div>
            </div>
            <button type="button" class="btn-del" data-del-addr="${a.id}" aria-label="حذف آدرس">${trashIcon()}</button>
          </div>`).join("");
        list.querySelectorAll(".addr-item").forEach(row => {
          const id = row.dataset.addrId;
          row.addEventListener("click", e => {
            if (e.target.closest("[data-del-addr]")) return;
            if (e.target.closest("input,label,button")) {
              selectAddr(id, { rerender: false });
              return;
            }
            selectAddr(id, { rerender: false });
          });
          row.addEventListener("focusin", () => selectAddr(id, { rerender: false }));
          row.querySelectorAll("input[data-f]").forEach(inp => {
            inp.addEventListener("input", () => {
              const pr = loadProfile();
              const addr = (pr.addresses || []).find(x => x.id === id);
              if (!addr) return;
              addr[inp.dataset.f] = inp.value;
              saveProfile(pr);
            });
            inp.addEventListener("change", () => {
              const pr = loadProfile();
              const addr = (pr.addresses || []).find(x => x.id === id);
              if (!addr) return;
              addr[inp.dataset.f] = inp.value.trim();
              saveProfile(pr);
            });
          });
        });
        list.querySelectorAll("[data-del-addr]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.preventDefault();
            e.stopPropagation();
            const pr = loadProfile();
            const addr = (pr.addresses || []).find(x => x.id === btn.dataset.delAddr);
            const label = addr && addr.label ? `آدرس «${addr.label}»` : "این آدرس";
            if (!window.confirm(`از حذف ${label} مطمئن هستید؟`)) return;
            pr.addresses = (pr.addresses || []).filter(x => x.id !== btn.dataset.delAddr);
            if (pr.selectedAddressId === btn.dataset.delAddr) {
              pr.selectedAddressId = pr.addresses[0] ? pr.addresses[0].id : null;
            }
            saveProfile(pr);
            renderAddrs();
          });
        });
      };



      renderPhones();
      renderAddrs();

      $("#addPhoneBtn").onclick = () => {
        const pr = loadProfile();
        pr.phones = pr.phones || [];
        pr.phones.push("");
        saveProfile(pr);
        renderPhones();
      };

      let pendingLatLng = null;
      const mapEl = $("#mapPicker");
      const mapWrap = mapEl.parentElement;

      const hideAddBtn = () => {
        if (mapAddBtn) { mapAddBtn.remove(); mapAddBtn = null; }
      };

      const showAddBtnAt = (latlng) => {
        hideAddBtn();
        mapAddBtn = document.createElement("button");
        mapAddBtn.type = "button";
        mapAddBtn.className = "map-add-btn";
        mapAddBtn.textContent = "افزودن به آدرس";
        mapWrap.appendChild(mapAddBtn);
        // pin tip = latlng point; lift button above default marker height (~41px)
        const point = mapPicker.latLngToContainerPoint(latlng);
        mapAddBtn.style.left = point.x + "px";
        mapAddBtn.style.top = point.y + "px";
        mapAddBtn.onclick = async () => {
          if (!pendingLatLng) return;
          mapAddBtn.disabled = true;
          mapAddBtn.textContent = "...";
          const label = await reverseGeocode(pendingLatLng.lat, pendingLatLng.lng)
            || `موقعیت ${pendingLatLng.lat.toFixed(4)}، ${pendingLatLng.lng.toFixed(4)}`;
          const pr = loadProfile();
          pr.addresses = pr.addresses || [];
          const id = "a" + Date.now();
          pr.addresses.push({
            id,
            lat: pendingLatLng.lat,
            lng: pendingLatLng.lng,
            label,
            desc: "",
            plaque: "",
            unit: ""
          });
          pr.selectedAddressId = id;
          saveProfile(pr);
          hideAddBtn();
          renderAddrs();
        };
      };


      const initMap = (lat, lng) => {
        destroyMap();
        mapPicker = L.map(mapEl).setView([lat, lng], 15);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap"
        }).addTo(mapPicker);
        mapMarker = L.marker([lat, lng], { draggable: true }).addTo(mapPicker);
        pendingLatLng = { lat, lng };
        mapMarker.on("dragend", () => {
          const pos = mapMarker.getLatLng();
          pendingLatLng = { lat: pos.lat, lng: pos.lng };
          showAddBtnAt(pos);
        });
        mapPicker.on("click", e => {
          pendingLatLng = { lat: e.latlng.lat, lng: e.latlng.lng };
          mapMarker.setLatLng(e.latlng);
          showAddBtnAt(e.latlng);
        });
        mapPicker.on("move", () => {
          if (mapAddBtn && pendingLatLng) {
            const ll = L.latLng(pendingLatLng.lat, pendingLatLng.lng);
            const point = mapPicker.latLngToContainerPoint(ll);
            mapAddBtn.style.left = point.x + "px";
            mapAddBtn.style.top = point.y + "px";
          }
        });
        setTimeout(() => mapPicker.invalidateSize(), 120);
      };

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => initMap(pos.coords.latitude, pos.coords.longitude),
          () => initMap(35.6892, 51.3890),
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else initMap(35.6892, 51.3890);

      footer.innerHTML = `
        <div class="modal-footer-row">
          <button type="button" class="btn btn--ghost" id="backStep1">قبلی</button>
          <button type="button" class="btn btn--primary" id="toStep3">بعدی</button>
        </div>`;
      $("#backStep1").onclick = () => { state.checkoutStep = 1; renderCheckoutWizard(); };
      $("#toStep3").onclick = () => {
        const full = ($("#chkFullName").value || "").trim();
        if (!full) { window.alert("نام و نام خانوادگی الزامی است."); return; }
        const pr = loadProfile();
        const parts = full.split(/\s+/);
        pr.firstName = parts[0] || "";
        pr.lastName = parts.slice(1).join(" ") || parts[0];
        pr.phones = [...document.querySelectorAll("[data-phone-idx]")].map(i => i.value.trim()).filter(Boolean);
        document.querySelectorAll(".addr-item").forEach(row => {
          const id = row.dataset.addrId;
          const addr = (pr.addresses || []).find(x => x.id === id);
          if (!addr) return;
          row.querySelectorAll("input[data-f]").forEach(inp => {
            addr[inp.dataset.f] = inp.value.trim();
          });
        });
        saveProfile(pr);
        if (!pr.phones.length) { window.alert("حداقل یک شماره تماس وارد کنید."); return; }
        if (!pr.selectedAddressId || !(pr.addresses || []).some(a => a.id === pr.selectedAddressId)) {
          window.alert("یک آدرس تحویل انتخاب کنید.");
          return;
        }
        state.checkoutStep = 3;
        state.maxCheckoutStep = Math.max(state.maxCheckoutStep || 1, 3);
        renderCheckoutWizard();
      };
    }

    function renderConfirmStep(body, footer) {
      const profile = loadProfile();
      const addr = (profile.addresses || []).find(a => a.id === profile.selectedAddressId);
      const keys = Object.keys(state.cart);
      let total = 0;
      const rows = keys.map(key => {
        const entry = state.cart[key];
        const id = typeof entry === "object" ? entry.id : key;
        const qty = typeof entry === "object" ? entry.qty : entry;
        const color = typeof entry === "object" ? entry.color : null;
        const p = getProduct(id);
        if (!p) return "";
        total += p.price * qty;
        const colorCell = color
          ? `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${color};vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)"></span>`
          : "—";
        return `<tr>
          <td>${p.name}</td>
          <td>${p.model || "—"}</td>
          <td>${colorCell}</td>
          <td>${toFaDigits(qty)}</td>
          <td>${formatPrice(p.price * qty)} تومان</td>
        </tr>`;
      }).join("");

      const addrExtra = addr
        ? [addr.plaque ? `پلاک ${addr.plaque}` : "", addr.unit ? `واحد ${addr.unit}` : "", addr.desc || ""].filter(Boolean).join(" · ")
        : "";
      const addrLine = addr
        ? `${addr.label || ""}${addrExtra ? " — " + addrExtra : ""}`
        : "";

      body.innerHTML = `
        <div class="checkout-step">
          <p style="font-size:0.9rem"><strong>گیرنده:</strong> ${(profile.firstName || "")} ${(profile.lastName || "")}</p>
          <p style="font-size:0.85rem;color:var(--color-text-muted)"><strong>شماره تماس:</strong> ${(profile.phones || []).join(" · ")}</p>
          <p style="font-size:0.85rem;margin-top:8px">${addrLine}</p>
          <div style="margin-top:12px;overflow-x:auto">
            <table class="order-table">
              <thead>
                <tr>
                  <th>محصول</th>
                  <th>مدل</th>
                  <th>رنگ</th>
                  <th>تعداد</th>
                  <th>مبلغ</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="cart-total" style="margin-top:12px"><span>جمع</span><span>${formatPrice(total)} تومان</span></div>
          <label style="display:grid;gap:6px;margin-top:14px;font-size:0.85rem;font-weight:600">توضیحات سفارش
            <textarea id="orderNote" rows="3" placeholder="مثلاً قبل از ارسال تماس بگیرید">${state.orderNote || ""}</textarea>
          </label>
        </div>`;

      footer.innerHTML = `
        <div class="modal-footer-row">
          <button type="button" class="btn btn--ghost" id="backStep2">قبلی</button>
          <button type="button" class="btn btn--primary" id="confirmOrderBtn">ثبت نهایی</button>
        </div>`;
      $("#backStep2").onclick = () => { state.checkoutStep = 2; renderCheckoutWizard(); };
      $("#orderNote").addEventListener("input", e => { state.orderNote = e.target.value; });
      $("#confirmOrderBtn").onclick = () => {
        const pr = loadProfile();
        if (!(pr.firstName || "").trim()) { window.alert("نام و نام خانوادگی الزامی است."); state.checkoutStep = 2; renderCheckoutWizard(); return; }
        if (!(pr.phones || []).length) { window.alert("شماره تماس الزامی است."); state.checkoutStep = 2; renderCheckoutWizard(); return; }
        if (!pr.selectedAddressId) { window.alert("آدرس الزامی است."); state.checkoutStep = 2; renderCheckoutWizard(); return; }
        state.cart = {};
        state.orderNote = "";
        saveCart();
        destroyMap();
        closeCartModal();
        window.alert("سفارش شما با موفقیت ثبت شد.");
      };
    }

    function showCheckoutStep() {
      state.checkoutStep = 2;
      renderCheckoutWizard();
    }

    function categories() {
      const set = new Set(PRODUCTS.map(p => p.category).filter(Boolean));
      return ["همه", ...set];
    }

    function categoryIcon(cat) {
      const stroke = 'stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"';
      const icons = {
        "همه": `<svg viewBox="0 0 24 24" ${stroke}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`,
        "یخچال": `<svg viewBox="0 0 24 24" ${stroke}><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M6 10h12M10 6v2"/></svg>`,
        "لباسشویی": `<svg viewBox="0 0 24 24" ${stroke}><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="2"/></svg>`,
        "جاروبرقی": `<svg viewBox="0 0 24 24" ${stroke}><path d="M6 20h12a2 2 0 0 0 2-2v-5H4v5a2 2 0 0 0 2 2z"/><path d="M8 13V7a4 4 0 0 1 8 0"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg>`,
        "گاز": `<svg viewBox="0 0 24 24" ${stroke}><rect x="3" y="10" width="18" height="10" rx="1"/><circle cx="8" cy="15" r="2"/><circle cx="12" cy="15" r="2"/><circle cx="16" cy="15" r="2"/><path d="M8 10V7m4 3V5m4 5V7"/></svg>`,
        "مایکروویو": `<svg viewBox="0 0 24 24" ${stroke}><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M6 14h.01M10 10h8v4H10z"/></svg>`,
        "تصفیه هوا": `<svg viewBox="0 0 24 24" ${stroke}><path d="M8 12h8M6 8c2 0 3 2 6 2s4-2 6-2M6 16c2 0 3-2 6-2s4 2 6 2"/></svg>`,
        "آشپزخانه": `<svg viewBox="0 0 24 24" ${stroke}><path d="M4 4h6v16H4zM14 4h6v7h-6zM14 14h6v6h-6z"/></svg>`
      };
      return icons[cat] || icons["همه"];
    }

    function renderTabs() {
      const tabs = $("#categoryTabs");
      tabs.innerHTML = categories().map(cat => `
        <button type="button" class="tab ${state.category === cat ? "is-active" : ""}"
          role="tab" aria-selected="${state.category === cat}" data-cat="${cat}">
          <span class="tab__icon" aria-hidden="true">${categoryIcon(cat)}</span>${cat}
        </button>`).join("");
      tabs.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
          state.category = btn.getAttribute("data-cat");
          renderTabs();
          renderGrid();
        });
      });
    }



    function filteredProducts() {
      let list = state.category === "همه"
        ? [...PRODUCTS]
        : PRODUCTS.filter(p => p.category === state.category);
      const minP = state.filterPriceMin ?? 0;
      const maxP = state.filterPriceMax ?? Infinity;
      const minR = state.filterMinRating ?? 0;
      return list.filter(p => {
        const r = effectiveRating(p);
        return p.price >= minP && p.price <= maxP && r >= minR;
      });
    }

    function renderGrid() {
      const list = filteredProducts();
      $("#productsGrid").innerHTML = list.map(p => {
        const displayRating = effectiveRating(p);
        const slogan = p.slogan ? `<p class="product-card__slogan">${p.slogan}</p>` : "";
        return `
        <article class="product-card aura" data-open-card="${p.id}" role="button" tabindex="0">
          <div class="product-card__img">
            <img src="${p.images[0]}" alt="" loading="lazy" width="300" height="400" />
          </div>
          <div class="product-card__body">
            <h3 class="product-card__name">${p.name}</h3>
            ${slogan}
            <p class="card__model">${p.model}</p>
            <p class="product-card__price">${formatPrice(p.price)} تومان</p>
            <div class="meta-split">
              ${ratingHtml(p.id + "-card", displayRating, "rating--sm")}
              ${ordersLiveHtml(p.orders)}
            </div>
            <button type="button" class="btn btn--primary btn--sm" data-open="${p.id}">جزئیات / سفارش</button>
          </div>
        </article>`;
      }).join("") || `<p class="cart-empty">محصولی با این فیلتر یافت نشد</p>`;
      bindRating($("#productsGrid"));
    }



    function initFilters() {
      if (!PRODUCTS.length) return;
      const prices = PRODUCTS.map(p => p.price);
      const ratings = PRODUCTS.map(p => p.rating);
      const minPrice = Math.min(...prices);
      const maxPrice = Math.max(...prices);
      const minRating = Math.min(...ratings);

      if (state.filterPriceMin == null) state.filterPriceMin = minPrice;
      if (state.filterPriceMax == null) state.filterPriceMax = maxPrice;
      if (state.filterMinRating == null) state.filterMinRating = 0;

      const minInput = $("#priceMin");
      const maxInput = $("#priceMax");
      if (!minInput || !maxInput) return;

      const step = Math.max(1, Math.round((maxPrice - minPrice) / 100));
      minInput.min = maxInput.min = String(minPrice);
      minInput.max = maxInput.max = String(maxPrice);
      minInput.step = maxInput.step = String(step);
      minInput.value = String(state.filterPriceMin);
      maxInput.value = String(state.filterPriceMax);

      const updateFill = () => {
        let a = Number(minInput.value);
        let b = Number(maxInput.value);
        if (a > b) a = b;
        if (b < a) b = a;
        const range = maxPrice - minPrice || 1;
        // vertical rotated: value maps bottom=min top=max
        const minPct = ((a - minPrice) / range) * 100; // from bottom
        const maxPct = ((b - minPrice) / range) * 100;
        const fill = $("#priceFill");
        if (fill) {
          fill.style.bottom = minPct + "%";
          fill.style.top = (100 - maxPct) + "%";
          fill.style.height = "auto";
          fill.style.left = "50%";
          fill.style.width = "4px";
          fill.style.marginLeft = "-2px";
        }
        const minLab = $("#priceMinLabel");
        const maxLab = $("#priceMaxLabel");
        if (minLab) {
          minLab.textContent = formatPrice(a) + " تومان";
          // bottom-based position mirrored: top = 100 - minPct
          let topMin = 100 - minPct;
          let topMax = 100 - maxPct;
          // keep labels from overlapping when thumbs meet
          if (Math.abs(topMin - topMax) < 12) {
            topMin = topMax + 12;
            if (topMin > 100) { topMin = 100; topMax = 88; }
          }
          minLab.style.top = topMin + "%";
          maxLab.style.top = topMax + "%";
          maxLab.textContent = formatPrice(b) + " تومان";
        }
      };

      const onMin = () => {
        let a = Number(minInput.value);
        let b = Number(maxInput.value);
        if (a > b) {
          a = b;
          minInput.value = String(a);
        }
        state.filterPriceMin = a;
        state.filterPriceMax = b;
        updateFill();
        renderGrid();
      };
      const onMax = () => {
        let a = Number(minInput.value);
        let b = Number(maxInput.value);
        if (b < a) {
          b = a;
          maxInput.value = String(b);
        }
        state.filterPriceMin = a;
        state.filterPriceMax = b;
        updateFill();
        renderGrid();
      };
      minInput.oninput = onMin;
      maxInput.oninput = onMax;
      updateFill();

      const stars = $("#minRatingStars");
      const anyBtn = $("#minRatingAny");
      if (stars) {
        const v = Math.max(0, Math.min(5, Math.round(state.filterMinRating || 0)));
        stars.dataset.value = String(v);
        stars.querySelectorAll("input").forEach(inp => {
          inp.checked = v > 0 && Number(inp.value) === v;
          inp.onchange = () => {
            state.filterMinRating = Number(inp.value);
            stars.dataset.value = String(state.filterMinRating);
            renderGrid();
          };
        });
      }
      if (anyBtn) {
        anyBtn.onclick = () => {
          state.filterMinRating = 0;
          if (stars) {
            stars.dataset.value = "0";
            stars.querySelectorAll("input").forEach(inp => { inp.checked = false; });
          }
          renderGrid();
        };
      }
    }






    function openContactModal() {
      const ov = $("#contactModal");
      ov.hidden = false;
      requestAnimationFrame(() => ov.classList.add("is-open"));
      ov.setAttribute("aria-hidden", "false");
      lockScroll(true);
    }

    function closeContactModal() {
      const ov = $("#contactModal");
      ov.classList.remove("is-open");
      ov.setAttribute("aria-hidden", "true");
      lockScroll(false);
      setTimeout(() => { ov.hidden = true; }, 220);
    }


    let resizeTimer = null;
    function onResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const next = maxSlideCount();
        const current = $$("#collection .swiper-slide").length;
        if (next !== current) {
          renderCollection();
          initCollection();
        }
      }, 180);
    }

    function bindEvents() {
      $("#cartBtn").addEventListener("click", openCartModal);
      $("#closeCart").addEventListener("click", closeCartModal);
      $("#cartModal").addEventListener("click", e => {
        if (e.target === $("#cartModal")) closeCartModal();
      });

      $("#closeModal").addEventListener("click", closeOrderModal);
      $("#orderModal").addEventListener("click", e => {
        if (e.target === $("#orderModal")) closeOrderModal();
      });

      $("#contactBtn").addEventListener("click", openContactModal);
      $("#closeContact").addEventListener("click", closeContactModal);
      $("#contactModal").addEventListener("click", e => {
        if (e.target === $("#contactModal")) closeContactModal();
      });

      window.addEventListener("resize", onResize);

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          closeContactModal();
          closeOrderModal();
          closeCartModal();
        }
      });

      document.addEventListener("click", e => {
        if (e.target.closest(".rating")) return; // rating edits should not open modal
        const openBtn = e.target.closest("[data-open]");
        if (openBtn) {
          e.preventDefault();
          e.stopPropagation();
          openOrderModal(openBtn.getAttribute("data-open"));
          return;
        }
        const card = e.target.closest("[data-open-card]");
        if (card) {
          openOrderModal(card.getAttribute("data-open-card"));
        }
      });
      document.addEventListener("keydown", e => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const card = e.target.closest("[data-open-card]");
        if (card && !e.target.closest("button")) {
          e.preventDefault();
          openOrderModal(card.getAttribute("data-open-card"));
        }
      });
    }

    async function boot() {
      try {
        const res = await fetch("./config/products.json", { cache: "no-store" });
        if (!res.ok) throw new Error("products.json " + res.status);
        PRODUCTS = await res.json();
      } catch (err) {
        console.error(err);
        PRODUCTS = [];
      }
      renderCollection();
      initCollection();
      renderTabs();
      initFilters();
      renderGrid();
      updateCartBadge();
      bindEvents();
    }

    boot();
  </script>
</body>
</html>
